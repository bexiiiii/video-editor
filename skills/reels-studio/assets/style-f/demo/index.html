<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Style F demo — Kinetic Talking Head</title>
    <!-- Run ./prepare.sh first: copies runtime + Style F pack into ./lib (HyperFrames forbids "../" paths).
         Identity is the demo brand "Link HR" / "@linkhr" — never the reference channel.
         Footage = labelled neutral slot (never a drawn person); the slot re-frames per segment (wide 1.0 ↔ tight 1.4)
         to show the one-camera "two framings" logic that edit_head.py writes into edit/cuts.json for real footage.
         Object = Microsoft Fluent Emoji 3D "Mobile phone" (MIT, github.com/microsoft/fluentui-emoji), Lanczos-upscaled,
         standing in for the reels-art glossy 3D render a real run generates. Screen recording = labelled slot
         (scripts/broll.py produces the real clip in a run; third-party captures are never committed). Silent (Style F reference is voice-only; mix.py adds the energetic profile). -->
    <link rel="stylesheet" href="lib/tokens-f.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/runtime.js"></script>
    <script src="lib/f.js"></script>
    <style>
      body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .scene { position: absolute; inset: 0; }
      #caps, #fx { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Hard cuts only (Style F): adjacent clips, no overlaps. Times are absolute on the one main timeline. -->
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="27">
      <div id="s1" class="scene clip" data-start="0" data-duration="2.8" data-track-index="1"></div>
      <div id="s2" class="scene clip" data-start="2.8" data-duration="1.8" data-track-index="2"></div>
      <div id="s3" class="scene clip" data-start="4.6" data-duration="2.4" data-track-index="1"></div>
      <div id="s4" class="scene clip" data-start="7" data-duration="2.6" data-track-index="2"></div>
      <div id="s5" class="scene clip" data-start="9.6" data-duration="2.4" data-track-index="1"></div>
      <div id="s6" class="scene clip" data-start="12" data-duration="2.6" data-track-index="2"></div>
      <div id="s7" class="scene clip" data-start="14.6" data-duration="2.2" data-track-index="1"></div>
      <div id="s8" class="scene clip" data-start="16.8" data-duration="2.6" data-track-index="2"></div>
      <div id="s9" class="scene clip" data-start="19.4" data-duration="2.5" data-track-index="1"></div>
      <div id="s10" class="scene clip" data-start="21.9" data-duration="2.7" data-track-index="2"></div>
      <div id="s11" class="scene clip" data-start="24.6" data-duration="2.4" data-track-index="1"></div>
      <div id="caps" class="clip" data-start="0" data-duration="24.6" data-track-index="3"></div>
      <div id="fx" class="clip" data-start="21.8" data-duration="0.4" data-track-index="4"></div>
    </div>
    <script>
      (async function () {
        await RSF.ready();
        const tl = gsap.timeline({ paused: true });
        const $ = (id) => document.getElementById(id);
        const L = RSF.layout;
        const BRAND = { name: "Link HR", handle: "@linkhr" };          // brief.cta — never the reference creator
        const HEAD = { label: "ваше видео", sub: "talking head · одна камера" };
        const T = RSF.M.tight;                                          // tight framing ≈ 1.4 about the face
        const cam = (...f) => Object.assign({ framings: f.map(([at, scale]) => ({ at, scale })) }, HEAD);

        /* s1 · head-side (W) — hook: question stacks up word by word, words RISE from below (hook only).
           Over footage: equal-size white lines, one red problem word (ref "ол ито / жүзеге / аспайды"). */
        L.headSide($("s1"), {
          footage: cam([0, 1]),
          stack: { enter: "rise", lines: [
            { text: "смена", role: "l", at: 0.2 },
            { text: "есебін әлі", role: "l", at: 0.5, stagger: 0.25 },
            { text: "*қолмен?*", role: "l", dx: 60, accent: "red", at: 1.05 },
          ] },
        }, tl, 0);

        /* s2 · insert-object (white) — the reference composition (2.6 s "2-ақ / вариант / бар!" under two capsules):
           glossy 3D object standing on a big / small (+3° tilt) / big stack, all black, left-aligned, third line nudged. */
        L.insertObject($("s2"), {
          bg: "white",
          object: { src: "obj-phone.png", w: 200, h: 280, rotate: -8, from: "top", at: 3.08 },
          stack: { lines: [
            { text: "1-ақ", role: "xl", at: 3.0 },
            { text: "түйме", role: "m", rot: 3, dx: 8, at: 3.3 },
            { text: "басу!", role: "xl", dx: 100, at: 3.6 },
          ] },
        }, tl, 2.8);

        /* s3 · head (W after the insert) — small captions only */
        L.head($("s3"), { footage: cam([4.6, 1]) }, tl, 4.6);

        /* s4 · head-side (T) — equal-size white stack, one yellow key phrase */
        L.headSide($("s4"), {
          footage: cam([7, T]),
          stack: { lines: [
            { text: "аптасына", role: "l", at: 7.7 },
            { text: "*12 сағат*", role: "l", dx: 70, at: 8.05 },
            { text: "үнемдейсіз", role: "l", at: 8.5 },
          ] },
        }, tl, 7);

        /* s5 · media — tilted full-bleed screen recording + white stack, one yellow word (ref 15.2 s) */
        L.media($("s5"), {
          broll: { label: "запись экрана · Link HR", dur: 2.4 },
          stack: { lines: [
            { text: "табель", role: "l", at: 9.8 },
            { text: "*өзі*", role: "l", dx: 90, at: 10.15 },
            { text: "толтырылады", role: "l", at: 10.5 },
          ] },
        }, tl, 9.6);

        /* s6 · head-side (W → T on the cut at 13.9) — stack blurs out in-segment, then a caption */
        L.headSide($("s6"), {
          footage: cam([12, 1], [13.9, T]),
          stack: { exitAt: 13.45, lines: [
            { text: "кешігулер", role: "l", at: 12.15 },
            { text: "азайды", role: "xl", dx: 40, at: 12.55 },
          ] },
        }, tl, 12);

        /* s7 · number (salmon) — label + big number + circle object + stack (white / black accent) */
        L.number($("s7"), {
          bg: "salmon", label: "кешігу", value: "−38%", at: 14.8, valueAt: 15.0,
          object: { circle: true, w: 400, label: "иконка", sub: "в белом круге", from: "top", at: 15.08 },
          stack: { lines: [{ text: "*бір айда*", role: "l", at: 15.6 }] },
        }, tl, 14.6);

        /* s8 · head (W → T at 18.4) — captions only */
        L.head($("s8"), { footage: cam([16.8, 1], [18.4, T]) }, tl, 16.8);

        /* s9 · list (white) — condensed headline + numbered kinetic lines */
        L.list($("s9"), {
          bg: "white",
          headline: { text: "3 қадам", at: 19.6 },
          items: [
            { text: "жүктеу", at: 19.95 },
            { text: "қосу", at: 20.45 },
            { text: "бақылау", at: 20.95 },
          ],
        }, tl, 19.4);

        /* s10 · head-side (W, then T at 23.2) — closing stack, light leak over the cut */
        L.headSide($("s10"), {
          footage: cam([21.9, 1], [23.2, T]),
          stack: { exitAt: 22.85, lines: [
            { text: "*сынап*", role: "xl", at: 22.05 },
            { text: "көріңіз", role: "m", align: "right", at: 22.4 },
          ] },
        }, tl, 21.9);
        RSF.leak($("fx"), tl, 21.9);

        /* s11 · cta — black end card, identity from the brief */
        L.cta($("s11"), { handle: BRAND.handle }, tl, 24.6);

        /* small literal captions — one track over the head segments, never under a stack */
        RSF.caption($("caps"), { phrases: [
          { text: "біз Link HR-да", at: 4.62, end: 5.4 },
          { text: "мұны / автоматтадық", at: 5.4, end: 6.2 },
          { text: "*бір* қосымшамен", at: 6.2, end: 7.0 },
          { text: "қызметкер", at: 7.02, end: 7.62 },
          { text: "небәрі / *бір айда*", at: 13.92, end: 14.6 },
          { text: "қағаз журнал", at: 16.82, end: 17.6 },
          { text: "енді *керек емес*", at: 17.6, end: 18.4 },
          { text: "бәрі онлайн", at: 18.42, end: 19.4 },
          { text: "*14 күн* тегін", at: 23.22, end: 24.6 },
        ] }, tl);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
