<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Style A demo — 3D Keyword</title>
    <!-- Run ./prepare.sh first: copies shared runtime + Style A tokens/lib into ./lib (HyperFrames forbids "../" asset paths). -->
    <link rel="stylesheet" href="lib/tokens-a.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/runtime.js"></script>
    <script src="lib/a.js"></script>
    <style>
      body { margin: 0; background: #0B0D0D; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!--
      A 31.5 s reel ("подписки съедают бюджет") built from the layout catalogue (references/layouts.md):
      hero · number · list · stack · media · compare · statement · visual-top · CTA — no layout twice in a row,
      entrances pop → roll → build-down → rise → slide → side-slide/cut → selection → drop → rise.
      3D objects are Microsoft Fluent Emoji 3D PNGs (MIT, img/LICENSE.md) standing in for generated renders.
      Clip windows: start = previous transition − 0.25 s, end = next transition + 0.15 s (RSA.transitionWindow).
    -->
    <div id="root" class="rsa-stage" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="31.5">
      <div id="s01" class="scene clip" data-start="0" data-duration="3.75" data-track-index="1"></div>
      <div id="s02" class="scene clip" data-start="3.35" data-duration="3.8" data-track-index="2"></div>
      <div id="s03" class="scene clip" data-start="6.75" data-duration="4.4" data-track-index="1"></div>
      <div id="s04" class="scene clip" data-start="10.75" data-duration="3.8" data-track-index="2"></div>
      <div id="s05" class="scene clip" data-start="14.15" data-duration="4.2" data-track-index="1"></div>
      <div id="s06" class="scene clip" data-start="17.95" data-duration="4.1" data-track-index="2"></div>
      <div id="s07" class="scene clip" data-start="21.65" data-duration="3.1" data-track-index="1"></div>
      <div id="s08" class="scene clip" data-start="24.35" data-duration="3.6" data-track-index="2"></div>
      <div id="s09" class="scene clip" data-start="27.55" data-duration="3.95" data-track-index="1"></div>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const IMG = (n) => "img/" + n + ".png";
        // transition centres (= next sentence onset)
        const TC = [3.6, 7.0, 11.0, 14.4, 18.2, 21.9, 24.6, 27.8];
        const THEME = ["curtain", "light", "dark", "light", "space", "light", "navy", "light", "dark"];
        const L = THEME.map((theme, i) => RSA.layer(document.getElementById("s" + String(i + 1).padStart(2, "0")), { theme, drift: 4 }, tl, i ? TC[i - 1] - 0.25 : 0));
        const S = (i) => (i ? TC[i - 1] : 0);
        const C = (i) => L[i].inner;

        // 1 · hook — hero: money with wings pops on «съедают»
        RSA.layout.hero(C(0), {
          text: "подписки / съедают бюджет", stagger: 0.16, textAt: 0.1,
          visual: { type: "hero", props: { src: IMG("money_with_wings"), entry: "pop" }, t: 0.55 },
          caption: "а ты этого даже не замечаешь", captionAt: 1.45,
        }, tl, S(0));

        // 2 · number — slot-machine roll + keyword pill
        RSA.layout.number(C(1), {
          label: "в среднем уходит", value: "4 700", pill: "₽ каждый месяц",
          caption: "на сервисы, о которых ты забыл",
          labelAt: S(1) + 0.05, rollAt: S(1) + 0.45, pillAt: S(1) + 1.0, captionAt: S(1) + 1.6,
        }, tl, S(1));

        // 3 · list — rows build downward
        RSA.layout.list(C(2), {
          text: "где утекают / деньги", interval: 0.5,
          items: [
            { icon: IMG("clapper_board"), title: "кино", sub: "3 сервиса", value: "1 290 ₽" },
            { icon: IMG("musical_note"), title: "музыка", sub: "2 семейных тарифа", value: "598 ₽" },
            { icon: IMG("cloud"), title: "облако", sub: "забытые 200 ГБ", value: "299 ₽" },
            { icon: IMG("mobile_phone"), title: "приложения", sub: "пробные периоды", value: "2 513 ₽" },
          ],
        }, tl, S(2));

        // 4 · stack — kicker chip + headline + magnifier rising from below
        RSA.layout.stack(C(3), {
          kicker: "шаг 1", text: "найди все / списания",
          visual: { type: "hero", props: { src: IMG("magnifying_glass_tilted_left"), entry: "rise" }, t: S(3) + 0.55 },
          caption: "выписка за последние 3 месяца", captionAt: S(3) + 1.3,
        }, tl, S(3));

        // 5 · media — bank screen slides in, red box jumps, lens magnifies the forgotten one
        RSA.layout.media(C(4), {
          text: "смотри / автоплатежи", visualH: 800, visualW: 640,
          visual: { type: "screenshot", t: S(4) + 0.3, props: {
            theme: "dark", title: "Подписки", entry: "slide", from: "right",
            rows: [
              { src: IMG("clapper_board"), text: "Онлайн-кино", value: "499 ₽" },
              { src: IMG("clapper_board"), text: "Сериалы", value: "399 ₽" },
              { src: IMG("musical_note"), text: "Музыка", value: "299 ₽" },
              { src: IMG("cloud"), text: "Облако", value: "299 ₽" },
              { src: IMG("mobile_phone"), text: "Фоторедактор", value: "990 ₽" },
              { src: IMG("credit_card"), text: "Доставка+", value: "349 ₽" },
              { src: IMG("mobile_phone"), text: "Трекер сна", value: "1 524 ₽" },
            ],
            highlights: [{ x: 22, y: 487, w: 596, h: 96, t: S(4) + 1.2 }, { x: 22, y: 663, w: 596, h: 96, t: S(4) + 1.95 }],
            lens: { x: 190, y: 711, t: S(4) + 2.3, zoom: 1.8, size: 124 },
          } },
          caption: "банк уже собрал их за тебя", captionAt: S(4) + 1.0, captionColor: "#E2E0E8",
        }, tl, S(4));

        // 6 · compare — before / after cards slide from opposite sides, scissors cut along the dashed line
        RSA.layout.compare(C(5), {
          text: "оставь / только нужное",
          before: { icon: IMG("money_with_wings"), title: "было", sub: "7 подписок", value: "4 700 ₽" },
          after: { icon: IMG("money_bag"), title: "стало", sub: "3 подписки", value: "1 490 ₽", valueColor: "#257CFA" },
          divider: { type: "hero", props: { src: IMG("scissors"), entry: "slide", from: "left", shadow: false } },
          beforeAt: S(5) + 0.4, afterAt: S(5) + 1.5,
          caption: "минус 3 210 ₽ в месяц", captionAt: S(5) + 2.1,
        }, tl, S(5));

        // 7 · statement — breath scene, second line selected like text in iOS
        RSA.layout.statement(C(6), { text: "отменяй / без жалости", select: true, selectAt: S(6) + 0.85 }, tl, S(6) + 0.05);

        // 8 · visual-top — the bell drops in, headline lands under it
        RSA.layout["visual-top"](C(7), {
          text: "поставь / напоминание",
          visual: { type: "hero", props: { src: IMG("bell"), entry: "drop" }, t: S(7) + 0.1 },
          caption: "за 2 дня до списания", captionAt: S(7) + 1.2,
        }, tl, S(7));

        // 9 · CTA — bookmark rises, held to the end
        RSA.bookmarkCTA(C(8), { headline: "сохрани", title: "чек-лист подписок", caption: "пригодится в конце месяца" }, tl, S(8) + 0.05);

        // transitions — all centred on the next sentence onset
        const T = [
          { type: "zoom" }, { type: "blur-drift", dir: "down" }, { type: "lum" }, { type: "whip", dir: "up" },
          { type: "blur-drift", dir: "left" }, { type: "lum" }, { type: "whip", dir: "down" }, { type: "lum" },
        ];
        T.forEach((o, i) => RSA.transition(tl, L[i], L[i + 1], TC[i], o));

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
